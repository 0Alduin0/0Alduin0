name: Profil kapağını güncelle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-profile.yml"
      - "assets/base-scene.png"
      - "requirements.txt"
      - "scripts/generate_hero.py"

permissions:
  contents: write

concurrency:
  group: profile-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Depoyu al
        uses: actions/checkout@v6

      - name: Python'ı hazırla
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Betikleri doğrula
        run: python -m compileall -q scripts

      - name: Unity temalı kapağı oluştur
        run: >-
          python scripts/generate_hero.py
          --name "ENES YÜREKLİ"
          --role "UNITY OYUN GELİŞTİRİCİSİ"

      - name: Üretilen dosyaları doğrula
        run: |
          test -s assets/hero.gif
          test -s assets/hero-preview.png

      - name: Değişen görselleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero.gif assets/hero-preview.png
          if git diff --cached --quiet; then
            echo "Profil görselleri zaten güncel."
          else
            git commit -m "chore: profil görsellerini güncelle"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
