<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">0Alduin0 GitHub verileri güncelleniyor</title>
  <desc id="desc">Gerçek GitHub verileri ilk workflow çalışmasında otomatik olarak yüklenecek.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060b18"/>
      <stop offset="0.55" stop-color="#08142a"/>
      <stop offset="1" stop-color="#120d2c"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36e8ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#36e8ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#9c6aff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .label { fill: #8eaac5; font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1.2px; }
      .title { fill: #eefaff; font: 800 29px Inter, ui-sans-serif, system-ui, sans-serif; }
      .small { fill: #a9bfd4; font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .scan { animation: scan 4s ease-in-out infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes scan { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
      @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect width="1000" height="390" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="388" rx="23" fill="none" stroke="#36e8ff" stroke-opacity="0.22"/>
  <text x="34" y="39" class="label">ENES YÜREKLİ // KATKI ŞEHRİ</text>
  <path class="scan" d="M32 62H968" stroke="url(#line)" stroke-width="2"/>
  <g class="pulse">
    <rect x="317" y="135" width="366" height="120" rx="18" fill="#071226" stroke="#36e8ff" stroke-opacity="0.28"/>
    <text x="500" y="188" class="title" text-anchor="middle">GitHub verileri hazırlanıyor</text>
    <text x="500" y="222" class="small" text-anchor="middle">İlk workflow çalışması gerçek bilgileri yükleyecek.</text>
  </g>
</svg>
